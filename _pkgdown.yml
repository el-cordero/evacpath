url: https://el-cordero.github.io/evacpath/
destination: pkgdown

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    primary: "#651d28"
    base_font: system-ui
    heading_font: system-ui
    code_font: ui-monospace
  includes:
    in_header: |
      <style>
      :root {
        --evac-primary: #651d28;
        --evac-primary-dark: #401018;
        --evac-accent: #b46a3b;
        --evac-safety: #a94b4d;
        --evac-charcoal: #2f3433;
        --evac-muted: #66706e;
        --evac-bg: #faf9f6;
        --evac-soft: #f1f3f2;
        --evac-border: #d8dedb;
      }
      body {
        color: var(--evac-charcoal);
        background: var(--evac-bg);
      }
      main h1, main h2, main h3, main h4 {
        color: var(--evac-primary-dark);
      }
      a {
        color: var(--evac-primary);
      }
      div.sourceCode pre {
        min-height: 0 !important;
        padding-top: 0.9rem !important;
        padding-bottom: 0.9rem !important;
        background: var(--evac-soft);
        border: 1px solid var(--evac-border);
        border-radius: 8px;
      }
      div.sourceCode pre code span:empty {
        display: none;
      }
      .navbar {
        background: var(--evac-primary-dark) !important;
        border-bottom: 1px solid #8d3b46;
        box-shadow: 0 2px 10px rgba(34, 8, 12, 0.18);
      }
      .navbar-brand {
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #fffaf7 !important;
      }
      .navbar .nav-link,
      .navbar .nav-link.active,
      .navbar .nav-link:visited {
        color: #f7e9e4 !important;
      }
      .navbar .nav-link:hover,
      .navbar .nav-link:focus {
        color: #ffffff !important;
      }
      .navbar .dropdown-menu {
        background: #fffaf7;
        border-color: var(--evac-border);
      }
      .navbar .dropdown-item {
        color: var(--evac-charcoal);
      }
      .navbar .dropdown-item:hover,
      .navbar .dropdown-item:focus {
        color: #ffffff;
        background: var(--evac-primary);
      }
      .navbar .navbar-toggler {
        border-color: #e7b7ad;
      }
      .navbar .navbar-toggler-icon {
        filter: invert(1);
      }
      .template-home .page-header {
        border-left: none;
        padding-left: 0;
      }
      .template-home .description {
        color: var(--evac-muted);
        font-size: 1.12rem;
      }
      [data-bs-theme="dark"] .template-home .description {
        color: var(--bs-body-color);
      }
      img {
        max-width: 100%;
      }
      .template-article main img,
      .template-home main img {
        border: 1px solid var(--evac-border);
        border-radius: 10px;
        background: white;
        padding: 0.35rem;
      }
      .figure, .float {
        margin-top: 1.4rem;
        margin-bottom: 1.8rem;
      }
      .figcaption, .caption {
        color: var(--evac-muted);
        font-size: 0.92rem;
        margin-top: 0.45rem;
      }
      .table {
        font-size: 0.95rem;
      }
      .table thead th {
        background: var(--evac-soft);
        border-bottom: 1px solid var(--evac-border);
      }
      .table > :not(caption) > * > * {
        border-bottom-color: var(--evac-border);
      }
      a:not(.nav-link) {
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.14em;
      }
      [data-bs-theme="dark"] body {
        color: #f4f1ec;
        background: #1e2422;
      }
      [data-bs-theme="dark"] main h1,
      [data-bs-theme="dark"] main h2,
      [data-bs-theme="dark"] main h3,
      [data-bs-theme="dark"] main h4 {
        color: #f3c4ba;
      }
      [data-bs-theme="dark"] a:not(.nav-link) {
        color: #f3c4ba;
      }
      [data-bs-theme="dark"] div.sourceCode pre {
        color: #f4f1ec;
        background: #29312e;
        border-color: #4b5751;
      }
      [data-bs-theme="dark"] .template-article main img,
      [data-bs-theme="dark"] .template-home main img {
        background: #f8f7f4;
        border-color: #5a655f;
      }
      [data-bs-theme="dark"] .figcaption,
      [data-bs-theme="dark"] .caption,
      [data-bs-theme="dark"] .template-home .description {
        color: #c9d2cd;
      }
      [data-bs-theme="dark"] .table {
        --bs-table-color: #f4f1ec;
        --bs-table-bg: #1e2422;
        --bs-table-border-color: #4b5751;
      }
      [data-bs-theme="dark"] .table thead th {
        color: #f4f1ec;
        background: #29312e;
        border-bottom-color: #4b5751;
      }
      </style>

home:
  title: "evacpath"
  description: "Road-constrained least-cost pedestrian evacuation modeling in R."
  sidebar: false

navbar:
  structure:
    left: [intro, reference, examples, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/get-started.html
    examples:
      text: Examples
      menu:
        - text: Example workflow
          href: articles/examples.html
        - text: Tsunami evacuation workflow
          href: articles/tsunami-workflow.html
        - text: Diagnostic walkthrough
          href: articles/diagnostic-example.html
    articles:
      text: Articles
      menu:
        - text: Modeling assumptions
          href: articles/modeling-assumptions.html
        - text: Scenario comparison
          href: articles/scenario-comparison.html
        - text: Bottlenecks and validation
          href: articles/bottlenecks-validation.html

reference:
  - title: Package overview
    desc: Package-level help and a concise workflow overview.
    contents:
      - evacpath-package
  - title: Complete workflow
    desc: Run the full evacuation modeling workflow and write outputs.
    contents:
      - run_evacpath
      - make_output_clip_area
      - write_evac_outputs
  - title: Input preparation
    desc: Read, clean, project, and prepare hazard, road, elevation, and tsunami inputs.
    contents:
      - read_spatial
      - prepare_evac_inputs
      - prepare_hazard_zone
      - prepare_tsunami_zones
      - clean_roads
      - crop_roads_to_inner_extent
      - make_region_area
      - make_roads_in_zone
      - make_road_aware_escape_zone
  - title: Evacuation geometry
    desc: Build origin grids, road masks, escape points, and evacuation polygons.
    contents:
      - make_evac_grid
      - make_road_origins
      - find_escape_points
      - make_road_mask
      - make_evac_polygons
  - title: Least-cost modeling
    desc: Build conductance surfaces and calculate least-cost distance and evacuation time.
    contents:
      - make_conductance_surface
      - calc_min_distance_to_safety
      - calc_evac_time
      - calculate_lc_path
      - calculate_min_dist
      - interpolate_distance_surface
  - title: Diagnostics, scenarios, and validation
    desc: Compare assumptions, map bottlenecks, diagnose models, and validate routes.
    contents:
      - diagnose_evac_model
      - has_errors
      - compare_evac_scenarios
      - map_evac_bottlenecks
      - validate_evac_routes

articles:
  - title: Examples
    navbar: Examples
    contents:
      - examples
      - tsunami-workflow
      - custom-region-example
      - diagnostic-example
  - title: Guides
    navbar: Articles
    contents:
      - get-started
      - modeling-assumptions
      - scenario-comparison
      - comparing-evacuation-scenarios
      - bottlenecks-validation

authors:
  "Elvin Cordero":
    href: https://github.com/el-cordero

development:
  mode: release
