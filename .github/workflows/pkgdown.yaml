name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: any::pkgdown
      - name: Clean generated site output
        run: Rscript -e 'pkgdown::clean_site(force = TRUE)'
      - name: Restore local favicon assets
        run: |
          git checkout -- pkgdown/favicon
          cp _pkgdown.yml pkgdown/pkgdown.yml
      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE, install = TRUE)'
      - name: Configure deployment git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy pkgdown site
        run: Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE, install = TRUE, clean = TRUE)'
